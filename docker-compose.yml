services:
  sagesplit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sagesplit
    restart: unless-stopped
    ports:
      - "3044:3044"
    environment:
      - NODE_ENV=production
      - PORT=3044
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3044/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
